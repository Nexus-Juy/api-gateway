# Tests de api-gateway: sin config-server y sin Eureka.
# Las rutas apuntan a servicios falsos que levantan los propios tests (ver ServiciosFalsos).
spring:
  application:
    name: api-gateway
  cloud:
    config:
      enabled: false
    gateway:
      server:
        webflux:
          # CORS igual que en logitrack-config/api-gateway.yml (S3-08), con orígenes fijos para los tests.
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins: http://localhost:3000,http://localhost:5173
                allowed-methods: GET,POST,PUT,PATCH,OPTIONS
                allowed-headers: Authorization,Content-Type
                max-age: 3600

eureka:
  client:
    enabled: false

# Mismo secreto con el que los tests firman los JWT (ver TokensDePrueba).
jwt:
  secret: ClaveSecretaDeTestSuperSeguraParaTestsUnitariosLogiTrack2026!
